# Integration continue de NeoMundi Evidence.
#
# POURQUOI UNE FIXTURE, ET NON LES ARCHIVES DE DEMONSTRATION
#
# L archive GROUNDED-S1 porte `dataset_id: medmcqa-single`, trente `item_id`
# reels, et un `reference_evaluations.jsonl` qui croise `extracted_answer` et
# `status`. Pour ses treize observations au statut `correct`, l etiquette de
# reference de treize items MedMCQA serait EXACTEMENT reconstituable. La
# commiter aurait divulgue ces etiquettes -- et c est deja la raison pour
# laquelle ce membre avait ete exclu de l archive de demonstration MED.
#
# `tests/make_fixture.py` fabrique donc une archive sans aucun lien a un jeu
# de donnees reel, deterministe a l octet, et portant les proprietes dont
# chaque suite a besoin.
#
# CE QUE CETTE CI N ETABLIT PAS
#
# Les lignes de base PUBLIEES -- 19/0/2 sur GROUNDED-S1, 10/0/8 sur MED --
# ne sont pas verifiables ici, faute de ces archives. Elles restent un
# controle LOCAL, documente dans `docs/INTEGRATION.fr.md`. La CI verifie les lignes
# de base de la FIXTURE, qui sont un canari equivalent.

name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  suites:
    name: suites (python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Installer les dependances OPTIONNELLES
        run: |
          # `cryptography` pour signer, `opentimestamps` pour lire l arbre
          # d une preuve. Les deux sont OPTIONNELLES : un job separe eprouve
          # le comportement sans elles.
          python -m pip install --disable-pip-version-check --quiet \
            cryptography opentimestamps

      - name: Fabriquer la fixture
        run: |
          python tests/make_fixture.py "$RUNNER_TEMP/fixture" --profile v2
          echo "FIXTURE=$RUNNER_TEMP/fixture" >> "$GITHUB_ENV"
          echo "ARCHIVE=$RUNNER_TEMP/fixture/NEOMUNDI_EVIDENCE_CI_FIXTURE.zip" >> "$GITHUB_ENV"

      - name: La fixture est deterministe a l octet
        run: |
          python tests/make_fixture.py "$RUNNER_TEMP/fixture-bis" --profile v2 > /dev/null
          a=$(sha256sum "$ARCHIVE" | cut -d' ' -f1)
          b=$(sha256sum "$RUNNER_TEMP/fixture-bis/NEOMUNDI_EVIDENCE_CI_FIXTURE.zip" | cut -d' ' -f1)
          test "$a" = "$b" || { echo "::error::deux generations differentes : $a vs $b"; exit 1; }
          echo "empreinte stable : $a"

      - name: Verificateur -- lignes de base EXACTES
        run: |
          # Les attendus viennent du descripteur de la fixture : une seule
          # source de verite, et aucun nombre recopie a la main.
          attendu_avec=$(python -c "import json,os;print(json.load(open(os.environ['FIXTURE']+'/fixture.json'))['attendu']['verify_avec_corpus'])")
          attendu_sans=$(python -c "import json,os;print(json.load(open(os.environ['FIXTURE']+'/fixture.json'))['attendu']['verify_sans_corpus'])")
          obtenu_avec=$(python verify.py "$ARCHIVE" --corpus "$FIXTURE/corpus" | grep '^BILAN')
          obtenu_sans=$(python verify.py "$ARCHIVE" | grep '^BILAN')
          echo "avec corpus : $obtenu_avec"
          echo "sans corpus : $obtenu_sans"
          test "$obtenu_avec" = "$attendu_avec" || { echo "::error::attendu [$attendu_avec]"; exit 1; }
          test "$obtenu_sans" = "$attendu_sans" || { echo "::error::attendu [$attendu_sans]"; exit 1; }

      - name: Verificateur -- rapport lisible par machine
        run: |
          python verify.py "$ARCHIVE" --corpus "$FIXTURE/corpus" --json "$RUNNER_TEMP/r.json" > /dev/null
          python - <<'PY'
          import json, os
          r = json.load(open(os.environ["RUNNER_TEMP"] + "/r.json", encoding="utf-8"))
          assert r["schema"] == "neomundi.evidence.verification-report/1", r["schema"]
          # Les trois etats doivent rester TROIS champs distincts : un
          # consommateur qui ne lirait que pass et fail croirait a une
          # couverture complete.
          for cle in ("pass", "fail", "not_tested"):
              assert cle in r["counts"], cle
          assert r["counts"]["fail"] == 0, r["counts"]
          assert r["exit_code"] == 0, r["exit_code"]
          assert r["does_not_establish"], "le rapport doit dire ce qu il n etablit pas"
          print("rapport conforme :", r["counts"])
          PY

      - name: Mode strict -- ne change AUCUN verdict, seulement le code
        run: |
          # Memes verdicts avec et sans --strict : c est la propriete qui
          # fonde ce mode, et elle est verifiee et non supposee.
          sans=$(python verify.py "$ARCHIVE" | grep '^\[')
          avec=$(python verify.py "$ARCHIVE" --strict | grep '^\[')
          test "$sans" = "$avec" || { echo "::error::--strict a change des verdicts"; exit 1; }
          echo "verdicts identiques avec et sans --strict"

          # Codes de sortie : 0 quand la garantie requise est demontree,
          # 2 quand elle ne l est pas. Le defaut reste 0 dans les deux cas.
          python verify.py "$ARCHIVE" --corpus "$FIXTURE/corpus" --strict > /dev/null
          test $? -eq 0 || { echo "::error::strict avec corpus devrait rendre 0"; exit 1; }
          set +e
          python verify.py "$ARCHIVE" --strict > /dev/null; code=$?
          set -e
          test $code -eq 2 || { echo "::error::strict sans corpus devrait rendre 2, rendu $code"; exit 1; }
          python verify.py "$ARCHIVE" > /dev/null
          test $? -eq 0 || { echo "::error::le defaut non strict doit rester 0"; exit 1; }
          echo "codes : 0 avec corpus, 2 sans, 0 par defaut"

      - name: Suite de falsification
        run: |
          python tests/test_falsification.py "$ARCHIVE" "$FIXTURE/corpus"

      - name: Sonde contradictoire
        run: |
          # Pas de `tail` : le BILAN de cette suite est suivi de 22 lignes, et
          # un `tail -20` le coupait -- une CI qui cache son resume est
          # moins utile qu une CI verbeuse.
          python tests/test_adversarial.py "$ARCHIVE" "$FIXTURE/corpus"

      - name: Suite d attestation
        run: |
          python tests/test_attestation.py "$ARCHIVE" "$FIXTURE/corpus"

      - name: Suite d horodatage -- HORS RESEAU
        run: |
          # `tests/test_timestamp_network.py` n est PAS lance ici : il touche
          # quatre serveurs tiers, et une CI qui rougit sans cause interne
          # apprend a ignorer le rouge.
          python tests/test_timestamp.py

      - name: Horodatage -- la liaison ne depend de RIEN
        run: |
          # La propriete qui fonde l architecture : l empreinte engagee se lit
          # a offset fixe, donc la liaison tient sans `opentimestamps`.
          mkdir -p "$RUNNER_TEMP/sans-ots/opentimestamps"
          echo "raise ImportError('bloque')" > "$RUNNER_TEMP/sans-ots/opentimestamps/__init__.py"
          PYTHONPATH="$RUNNER_TEMP/sans-ots" python timestamp.py verify \
            examples/timestamp/NEOMUNDI_EVIDENCE_DEMO_V0.1.zip.jws.ots \
            --subject examples/attestation/NEOMUNDI_EVIDENCE_DEMO_V0.1.zip.jws
          PYTHONPATH="$RUNNER_TEMP/sans-ots" python - <<'PY'
          import subprocess, sys
          r = subprocess.run(
              [sys.executable, "timestamp.py", "verify",
               "examples/timestamp/NEOMUNDI_EVIDENCE_DEMO_V0.1.zip.jws.ots",
               "--subject", "examples/attestation/NEOMUNDI_EVIDENCE_DEMO_V0.1.zip.jws"],
              capture_output=True, text=True)
          liaison = next(l for l in r.stdout.splitlines()
                         if "liaison a l empreinte du sujet" in l)
          assert liaison.startswith("[PASS"), liaison
          arbre = next(l for l in r.stdout.splitlines()
                       if "arbre des attestations" in l)
          assert arbre.startswith("[NOT TESTED"), arbre
          assert r.returncode == 0
          print("liaison PASS sans la bibliotheque ; arbre NOT TESTED")
          PY

      - name: Horodatage -- PENDING n est pas une preuve de temps
        run: |
          set +e
          python timestamp.py verify \
            examples/timestamp/NEOMUNDI_EVIDENCE_DEMO_V0.1.zip.jws.ots \
            --subject examples/attestation/NEOMUNDI_EVIDENCE_DEMO_V0.1.zip.jws \
            --strict > /dev/null
          code=$?
          set -e
          test $code -eq 2 || { echo "::error::une preuve PENDING doit rendre 2 en strict, rendu $code"; exit 1; }
          python timestamp.py verify \
            examples/timestamp/NEOMUNDI_EVIDENCE_DEMO_V0.1.zip.jws.ots \
            --subject examples/attestation/NEOMUNDI_EVIDENCE_DEMO_V0.1.zip.jws \
            | grep -q "qualification eIDAS" \
            || { echo "::error::la ligne eIDAS doit etre rendue a chaque execution"; exit 1; }
          echo "PENDING -> code 2 en strict ; aucune qualification eIDAS revendiquee"

      - name: Suite de liaison
        run: |
          # Le manifeste de liaison est construit ICI : l exemple commite
          # porte sur l archive de demonstration, pas sur la fixture.
          obs=$(python -c "import json,os;print(json.load(open(os.environ['FIXTURE']+'/fixture.json'))['first_observation_id'])")
          cd "$FIXTURE/binding"
          python "$GITHUB_WORKSPACE/bind.py" build \
            --archive "$ARCHIVE" --observation "$obs" \
            --artifact response=response.txt \
            --artifact recording=responses/fixture-a.json \
            --created-at 2026-01-01T00:00:00Z --out manifest.json > /dev/null
          cd "$GITHUB_WORKSPACE"
          python tests/test_binding.py "$ARCHIVE" "$FIXTURE/binding"

      - name: Suite de reconciliation
        run: |
          python tests/test_reconciliation.py

      # Un BOM UTF-8 est banal : PowerShell en met un, et 15 des 22
      # fichiers du dossier reel du 30 octobre en portent. Refuser un
      # fichier valide pour cette raison accuse le partenaire a notre place.
      - name: Suite BOM -- un fichier a BOM reste lisible
        run: |
          python tests/test_bom.py

      # L evaluation ODA3 du 6 novembre a mesure un registre source de 151
      # enregistrements pour un export de 120, avec un manifeste annoncant
      # 151. Et une archive amputee d une observation, decomptes refaits,
      # franchissait `verify.py` a 19 PASS / 0 FAIL. L integrite interne ne
      # dit rien de la completude de l export : cette suite tient les deux
      # separees, et garde la reproductibilite du profil v1 -- dont une
      # attestation Ed25519 et une ancre Bitcoin dependent.
      - name: Suite de completude -- l integrite ne suffit pas
        run: |
          python tests/test_completude.py

      # B-1 : l entite emettrice est NeoMundi Recherche, en capacite
      # `experimental` -- entite nommee, decision prise, et AUCUN pouvoir
      # verifie. Cette suite verrouille les trois glissements possibles :
      # lire `experimental` comme un `verified` plus faible, laisser une
      # valeur declaree changer un verdict, et presenter une attestation
      # experimentale comme une certification juridique.
      - name: Suite de capacite -- declaree n est jamais verifiee
        run: |
          python tests/test_capacite.py

      # B-2 : le registre des paquets signes, et l asymetrie entre une
      # rotation et une compromission. Les cas 5 et 6 la mesurent sur la
      # MEME attestation, inchangee a l octet : rotation -> PASS,
      # compromission -> FAIL. Si les deux rendaient le meme verdict, l un
      # des deux mecanismes serait faux.
      - name: Suite de cles -- rotation, compromission, registre
        run: |
          python tests/test_cles.py

      # C-5 : la barriere avant publication. Un auditeur telecharge le
      # paquet ET le magasin depuis le MEME endroit ; qui controle cet
      # endroit controle les deux. Le correctif est de publier l empreinte
      # du magasin ailleurs -- et cette suite verifie que la charge du
      # second canal ne porte AUCUN materiel de cle, et qu un audit en
      # echec ne produit aucune charge.
      - name: Suite de publication -- ce qui sort ne revient pas
        run: |
          python tests/test_publication.py

      # B-3 : l ingestion d un paquet tiers. `verify.py` n accepte qu une
      # archive DEJA au format Evidence ; confronte au dossier reel du
      # 30 octobre -- 21 empreintes declarees, 21 concordantes -- il a refuse
      # a juste titre. Rien ne convertissait une collecte brute en objet
      # exploitable. Le cas 13 est le verrou qui compte : aucune ligne de
      # nature DECLARE ne peut porter PASS.
      - name: Suite d ingestion -- une declaration n est pas un fait
        run: |
          python tests/test_ingestion.py

      # R-6 : la provenance instrumentale. L API sert, par signal,
      # l evaluateur et ses empreintes de configuration ; Station en
      # modelise la conservation ; et l export `/2` ne les transporte pas.
      # Les cas 2, 3 et 10 sont les verrous : une absence de provenance ne
      # devient jamais une provenance attestee, un evaluateur absent n est
      # ni un echec ni un score, et aucun indemontrable ne porte PASS.
      - name: Suite de provenance -- nommer ce qui manque
        run: |
          python tests/test_provenance.py

      # La langue ne doit changer que la prose. Un etat, un code de sortie,
      # un nom de champ ou une empreinte qui bouge avec la langue est un
      # defaut. Le cas 7 MESURE la couverture du catalogue au lieu de la
      # supposer, et le cas 13 la mesure sur 7 regimes d echec.
      - name: Suite FR/EN -- la langue ne change que la prose
        run: |
          python tests/test_i18n.py "$ARCHIVE" "$FIXTURE/corpus"

      - name: Reconciliation -- les cinq statuts, et rien de devine
        run: |
          python adapters/receipt_import.py \
            examples/reconciliation/receipt-synthetic.html \
            --received-at 2026-11-05T12:00:00Z --out "$RUNNER_TEMP/recu.json" > /dev/null
          python adapters/reconcile.py "$RUNNER_TEMP/recu.json" \
            --archive "$ARCHIVE" \
            --map examples/reconciliation/map-comparable.json \
            --json "$RUNNER_TEMP/recon.json" > /dev/null
          python - <<'PY'
          import json, os
          r = json.load(open(os.environ["RUNNER_TEMP"] + "/recon.json", encoding="utf-8"))
          vus = set(r["counts"])
          attendus = {"MATCHED", "MISMATCHED", "MISSING", "NOT COMPARABLE",
                      "NOT VERIFIABLE"}
          assert attendus <= vus, "statuts manquants : %s" % (attendus - vus)
          # Les contradictions doivent etre CONSERVEES, les deux cotes.
          assert r["contradictions_preserved"], "aucune contradiction conservee"
          # Et le recu ne doit JAMAIS etre qualifie de signe.
          texte = json.dumps(r, ensure_ascii=False).lower()
          assert "signature verifiee" not in texte
          print("cinq statuts distingues :",
                ", ".join("%s=%d" % (k, v) for k, v in sorted(r["counts"].items())))
          print("%d contradiction(s) conservee(s)" % len(r["contradictions_preserved"]))
          PY

      - name: Reconciliation -- une empreinte concorde malgre la frontiere
        run: |
          # Regression verrouillee : une version de mesure non declaree rendait
          # TOUS les champs NOT COMPARABLE, y compris une empreinte qui
          # concorde -- detruisant la preuve la plus forte du dispositif.
          python adapters/reconcile.py "$RUNNER_TEMP/recu.json" \
            --archive "$ARCHIVE" \
            --map examples/reconciliation/map-no-context.json \
            --json "$RUNNER_TEMP/recon2.json" > /dev/null
          python - <<'PY'
          import json, os
          r = json.load(open(os.environ["RUNNER_TEMP"] + "/recon2.json", encoding="utf-8"))
          par_champ = {f["neomundi_field"]: f for f in r["fields"]}
          assert par_champ["response_sha256"]["status"] == "MATCHED", \
              par_champ["response_sha256"]
          assert par_champ["coherence_score"]["status"] == "NOT COMPARABLE", \
              par_champ["coherence_score"]
          print("empreinte MATCHED, valeur mesuree NOT COMPARABLE : la frontiere")
          print("ne mord que sur ce qui depend du contexte de mesure.")
          PY

      - name: Le dossier V1 soumis a la revue se verifie entierement
        run: |
          # Les cinq chaines du dossier de revue, sur les fichiers COMMITES.
          # Si l une se casse, la demonstration du 9 novembre se casse avec.
          cd examples/dossier-v1
          python ../../verify.py NEOMUNDI_EVIDENCE_V1_DEMO.zip --corpus corpus | grep '^BILAN'
          python ../../verify_attestation.py NEOMUNDI_EVIDENCE_V1_DEMO.zip.jws \
            --archive NEOMUNDI_EVIDENCE_V1_DEMO.zip \
            --trust-store trust-store.json --allow-test-keys | tail -5
          python ../../timestamp.py verify NEOMUNDI_EVIDENCE_V1_DEMO.zip.jws.ots \
            --subject NEOMUNDI_EVIDENCE_V1_DEMO.zip.jws \
            --descriptor NEOMUNDI_EVIDENCE_V1_DEMO.zip.jws.timestamp.json | grep '^BILAN'
          python ../../adapters/reconcile.py receipt-imported.json \
            --archive NEOMUNDI_EVIDENCE_V1_DEMO.zip --map map-comparable.json | grep '^BILAN'
          cd binding
          python ../../../bind.py verify manifest.json \
            --archive ../NEOMUNDI_EVIDENCE_V1_DEMO.zip \
            --attestation ../NEOMUNDI_EVIDENCE_V1_DEMO.zip.jws \
            --trust-store ../trust-store.json --allow-test-keys | tail -7

      - name: Le dossier V1 -- les resultats annonces au guide sont EXACTS
        run: |
          # Le guide de l auditeur annonce des chiffres. S ils derivent, un
          # relecteur du 9 novembre obtiendra autre chose que ce qu on lui a
          # promis -- et c est exactement ce qu il ne faut pas.
          cd examples/dossier-v1
          python - <<'PY'
          import re, subprocess, sys

          def lance(args):
              r = subprocess.run([sys.executable] + args, capture_output=True,
                                 text=True, encoding="utf-8", errors="replace")
              return r.stdout + r.stderr

          # UNE SEULE source de verite : `attendu.json`, que
          # `tests/test_completude.py` confronte a la realite au cas 15.
          # Deux echecs de CI le 6 novembre viennent de chiffres qui
          # n etaient verifies QUE par la CI.
          import json
          ATTENDU = json.loads(
              open("attendu.json", encoding="utf-8").read())["attendu"]

          attendus = [
              (["../../verify.py", "NEOMUNDI_EVIDENCE_V1_DEMO.zip",
                "--corpus", "corpus"],
               ATTENDU["verify_avec_corpus"]),
              (["../../verify_attestation.py", "NEOMUNDI_EVIDENCE_V1_DEMO.zip.jws",
                "--archive", "NEOMUNDI_EVIDENCE_V1_DEMO.zip",
                "--trust-store", "trust-store.json", "--allow-test-keys"],
               ATTENDU["attestation"]),
              (["../../timestamp.py", "verify",
                "NEOMUNDI_EVIDENCE_V1_DEMO.zip.jws.ots",
                "--subject", "NEOMUNDI_EVIDENCE_V1_DEMO.zip.jws",
                "--descriptor", "NEOMUNDI_EVIDENCE_V1_DEMO.zip.jws.timestamp.json"],
               ATTENDU["horodatage"]),
          ]
          for args, attendu in attendus:
              sortie = lance(args)
              assert attendu in sortie, (
                  "%s\n  attendu : %s\n  obtenu  : %s"
                  % (args[0], attendu,
                     next((l for l in sortie.splitlines()
                           if l.startswith("BILAN")), "aucun BILAN")))
              print("OK  %-28s %s" % (args[0].split("/")[-1], attendu))

          # Le niveau atteint, et l etat de l horodatage.
          att = lance(["../../verify_attestation.py",
                       "NEOMUNDI_EVIDENCE_V1_DEMO.zip.jws",
                       "--archive", "NEOMUNDI_EVIDENCE_V1_DEMO.zip",
                       "--trust-store", "trust-store.json", "--allow-test-keys"])
          assert "Niveau atteint : cryptographically_attested" in att, att[-400:]
          print("OK  attestation                niveau cryptographically_attested")

          ts = lance(["../../timestamp.py", "verify",
                      "NEOMUNDI_EVIDENCE_V1_DEMO.zip.jws.ots",
                      "--subject", "NEOMUNDI_EVIDENCE_V1_DEMO.zip.jws"])
          assert "PENDING" in ts and "n atteste aucune date" in ts, ts[-400:]
          print("OK  horodatage                 PENDING, aucune date attestee")
          PY

      - name: Le dossier V1 ne contient AUCUNE cle privee
        run: |
          python - <<'PY'
          import json, pathlib, re
          store = json.loads(
              pathlib.Path("examples/dossier-v1/trust-store.json").read_text(encoding="utf-8"))
          assert store.get("store_kind") == "test", store.get("store_kind")
          for cle in store["keys"]:
              assert cle["status"] == "test", cle
              assert not any(c in cle for c in ("d", "private", "private_key")), cle
          motif = re.compile(rb'"d"\s*:\s*"[A-Za-z0-9_-]{40,}"')
          for f in pathlib.Path("examples/dossier-v1").rglob("*"):
              if f.is_file():
                  assert not motif.search(f.read_bytes()), f
          print("magasin de statut `test`, aucune cle privee dans le dossier")
          PY

      - name: L exemple d attestation commite se verifie toujours
        run: |
          # Sans --archive : la concordance est NOT TESTED, et c est normal.
          # L archive attestee n est pas dans le depot, pour la raison dite
          # en tete de ce fichier.
          python verify_attestation.py \
            examples/attestation/NEOMUNDI_EVIDENCE_DEMO_V0.1.zip.jws \
            --trust-store examples/attestation/trust-store.json \
            --allow-test-keys | tail -12
          python - <<'PY'
          import subprocess, sys
          r = subprocess.run([sys.executable, "verify_attestation.py",
                              "examples/attestation/NEOMUNDI_EVIDENCE_DEMO_V0.1.zip.jws",
                              "--trust-store", "examples/attestation/trust-store.json",
                              "--allow-test-keys"],
                             capture_output=True, text=True)
          assert "[PASS      ] signature cryptographique" in r.stdout, r.stdout[-800:]
          # La cle de test NE DOIT PAS accorder d attestation sans le drapeau.
          r2 = subprocess.run([sys.executable, "verify_attestation.py",
                               "examples/attestation/NEOMUNDI_EVIDENCE_DEMO_V0.1.zip.jws",
                               "--trust-store", "examples/attestation/trust-store.json"],
                              capture_output=True, text=True)
          assert r2.returncode != 0, "une cle de test a ete acceptee sans --allow-test-keys"
          print("signature de l exemple verifiee ; cle de test refusee par defaut")
          PY

  sans-cryptography:
    name: sans cryptography -- NOT TESTED, jamais PASS
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fabriquer la fixture
        run: |
          python tests/make_fixture.py "$RUNNER_TEMP/fixture" --profile v2
          echo "ARCHIVE=$RUNNER_TEMP/fixture/NEOMUNDI_EVIDENCE_CI_FIXTURE.zip" >> "$GITHUB_ENV"
          echo "FIXTURE=$RUNNER_TEMP/fixture" >> "$GITHUB_ENV"

      - name: Le verificateur d archive est INDIFFERENT a cryptography
        run: |
          # `if` et non `&&` : sous `bash -e`, un `cmd && {...}` dont `cmd`
          # echoue rend non nul et avorte l etape -- alors que cet echec est
          # precisement le resultat attendu ici.
          if python -c "import cryptography" 2>/dev/null; then
            echo "::error::cryptography ne devrait pas etre installe dans ce job"
            exit 1
          fi
          python verify.py "$ARCHIVE" --corpus "$FIXTURE/corpus" | grep '^BILAN'
          python verify.py "$ARCHIVE" --corpus "$FIXTURE/corpus" > /dev/null
          test $? -eq 0 || { echo "::error::verify.py doit fonctionner sans dependance"; exit 1; }

      - name: Sans cryptography, la signature est NOT TESTED -- jamais PASS ni FAIL
        run: |
          python - <<'PY'
          import subprocess, sys
          commande = [sys.executable, "verify_attestation.py",
                      "examples/attestation/NEOMUNDI_EVIDENCE_DEMO_V0.1.zip.jws",
                      "--trust-store", "examples/attestation/trust-store.json",
                      "--allow-test-keys"]
          r = subprocess.run(commande, capture_output=True, text=True)
          ligne = next(l for l in r.stdout.splitlines()
                       if "signature cryptographique" in l)
          assert ligne.startswith("[NOT TESTED"), ligne
          assert r.returncode == 0, "le defaut non strict doit rendre 0"
          # En strict, le meme etat doit rendre 2 : la garantie requise n est
          # pas demontree, et un consommateur automatise doit le savoir.
          r2 = subprocess.run(commande + ["--strict"], capture_output=True, text=True)
          assert r2.returncode == 2, (r2.returncode, r2.stdout[-500:])
          ligne2 = next(l for l in r2.stdout.splitlines()
                        if "signature cryptographique" in l)
          assert ligne2 == ligne, "le mode strict a change le verdict"
          print("NOT TESTED sans cryptography ; code 0 par defaut, 2 en strict")
          PY

  discipline:
    name: discipline du depot
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Le verificateur d archive n importe AUCUNE dependance
        run: |
          python - <<'PY'
          import ast, pathlib, sys
          STDLIB = set(sys.stdlib_module_names)
          for fichier in ("verify.py", "canonical.py"):
              arbre = ast.parse(pathlib.Path(fichier).read_text(encoding="utf-8"))
              externes = set()
              for n in ast.walk(arbre):
                  if isinstance(n, ast.Import):
                      externes |= {a.name.split(".")[0] for a in n.names}
                  elif isinstance(n, ast.ImportFrom) and n.module and n.level == 0:
                      externes.add(n.module.split(".")[0])
              hors = sorted(m for m in externes
                            if m not in STDLIB and not pathlib.Path(m + ".py").is_file())
              assert not hors, "%s importe hors bibliotheque standard : %s" % (fichier, hors)
              print("%-16s : bibliotheque standard seule" % fichier)
          PY

      - name: Le verificateur n atteint AUCUNE cle privee
        run: |
          python - <<'PY'
          import ast, pathlib
          texte = pathlib.Path("verify_attestation.py").read_text(encoding="utf-8")
          arbre = ast.parse(texte)
          importes = set()
          for n in ast.walk(arbre):
              if isinstance(n, ast.Import):
                  importes |= {a.name.split(".")[0] for a in n.names}
              elif isinstance(n, ast.ImportFrom) and n.module:
                  importes.add(n.module.split(".")[0])
          assert "sign" not in importes, "le verificateur importe le signataire"
          interdits = [m for m in ("Ed25519PrivateKey", "private_bytes",
                                   "PrivateFormat", ".sign(") if m in texte]
          assert not interdits, "primitives privees trouvees : %s" % interdits
          print("aucun chemin vers une cle privee")
          PY

      - name: Le chemin de verification d horodatage ne touche AUCUN reseau
        run: |
          python - <<'PY'
          import ast, pathlib
          arbre = ast.parse(pathlib.Path("timestamp.py").read_text(encoding="utf-8"))
          fonctions = {n.name: n for n in ast.walk(arbre)
                       if isinstance(n, ast.FunctionDef)}
          interdits = []
          for nom in ("verifier", "rendre", "empreinte_engagee",
                      "lire_attestations", "charge_officielle", "inspect"):
              if nom not in fonctions:
                  continue
              source = ast.unparse(fonctions[nom])
              interdits += ["%s dans %s" % (m, nom)
                            for m in ("RemoteCalendar", "urlopen", "requests",
                                      "socket", "submit(") if m in source]
          assert not interdits, interdits
          print("verify et inspect sont hors ligne, verifie sur le graphe d appels")
          PY

      - name: La reconciliation REUTILISE bind.py, sans second moteur
        run: |
          python - <<'PY'
          import ast, pathlib
          source = pathlib.Path("adapters/reconcile.py").read_text(encoding="utf-8")
          arbre = ast.parse(source)
          importe = any(isinstance(n, ast.Import)
                        and any(a.name == "bind" for a in n.names)
                        for n in ast.walk(arbre))
          assert importe, "reconcile.py n importe pas bind"
          appels = {n.func.attr for n in ast.walk(arbre)
                    if isinstance(n, ast.Call) and isinstance(n.func, ast.Attribute)
                    and isinstance(n.func.value, ast.Name)
                    and n.func.value.id == "bind"}
          assert "lire_sujet" in appels, appels
          print("bind reutilise :", ", ".join(sorted(appels)))
          PY

      - name: Les octets commites sont ceux du travail -- aucun CRLF
        run: |
          # A casse la CI le 6 novembre : un `.jws` ecrit sous Windows
          # portait des CRLF, Git le normalisait, et son empreinte changeait
          # -- celle sur laquelle la preuve d horodatage s engage.
          python tests/test_no_crlf.py

      - name: Aucun materiau de cle privee dans le suivi
        run: |
          python - <<'PY'
          import re, subprocess
          suivis = subprocess.run(["git", "ls-files"], capture_output=True,
                                  text=True, check=True).stdout.split()
          MOTIFS = (
              ("materiau de cle privee", re.compile(rb'"d"\s*:\s*"[A-Za-z0-9_-]{40,}"')),
              ("bloc PEM prive", re.compile(rb"BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY")),
          )
          problemes = []
          for chemin in suivis:
              octets = open(chemin, "rb").read()
              for quoi, motif in MOTIFS:
                  if motif.search(octets):
                      problemes.append("%s : %s" % (chemin, quoi))
          assert not problemes, "\n".join(problemes)
          print("%d fichiers suivis, aucun materiau prive" % len(suivis))
          PY

      - name: Le signataire refuse d ecrire une cle dans le depot
        run: |
          python -m pip install --disable-pip-version-check --quiet cryptography
          set +e
          sortie=$(python sign.py genkey --kid ci-refus --out ./cle-interdite.json \
                     --valid-from 2026-01-01T00:00:00Z 2>&1)
          code=$?
          set -e
          test $code -ne 0 || { echo "::error::le signataire a accepte d ecrire dans le depot"; exit 1; }
          echo "$sortie" | grep -q "refus d ecrire" || { echo "::error::refus inattendu : $sortie"; exit 1; }
          test ! -f ./cle-interdite.json || { echo "::error::une cle a ete ecrite malgre le refus"; exit 1; }
          echo "garde confirmee : aucune cle privee ne peut etre ecrite sous la racine"

      - name: Tous les liens internes de la documentation resolvent
        run: |
          python - <<'PY'
          import pathlib, re
          casses = []
          for fichier in list(pathlib.Path(".").glob("*.md")) + list(pathlib.Path("docs").glob("*.md")):
              for m in re.finditer(r"\]\(([^)#]+?)(#[^)]*)?\)", fichier.read_text(encoding="utf-8")):
                  cible = m.group(1)
                  if cible.startswith(("http://", "https://", "mailto:")):
                      continue
                  if not (fichier.parent / cible).exists():
                      casses.append("%s -> %s" % (fichier, cible))
          assert not casses, "\n".join(casses)
          print("aucun lien interne casse")
          PY

      - name: Chaque document a sa paire EN/FR
        run: |
          python - <<'PY'
          import pathlib
          manquantes = []
          for fichier in pathlib.Path("docs").glob("*.md"):
              if fichier.name.endswith(".fr.md"):
                  pair = fichier.with_name(fichier.name[:-len(".fr.md")] + ".md")
              else:
                  pair = fichier.with_name(fichier.stem + ".fr.md")
              if not pair.exists():
                  manquantes.append("%s : pas de pendant %s" % (fichier.name, pair.name))
          # Les livrables nommes par la mission font exception : leurs deux
          # noms sont differents de part en part.
          EXCEPTIONS = {
              "AUDIT_CONTRADICTOIRE_EVIDENCE_2026-11-05.md",
              "ADVERSARIAL_AUDIT_EVIDENCE_2026-11-05.md",
          }
          manquantes = [m for m in manquantes if m.split(" :")[0] not in EXCEPTIONS]
          assert not manquantes, "\n".join(manquantes)
          print("toutes les paires EN/FR sont completes")
          PY
